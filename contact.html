<!DOCTYPE html>
<html>
    <head>
        <link href="contact.css" rel="stylesheet" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Contact Us</title>
    </head>
    <body>
        <nav>
            <div class="nav-header">
                <div class="business-name"><img src="Images/logo_small.png" height="40px" width="auto"/></div>
                <label for="menu-toggle" class="menu-icon">&#9776;</label>
            </div>
            <input type="checkbox" id="menu-toggle">
            <ul class="nav-menu">
                <li class="big-business-name business-name"><img src="Images/logo_small.png" height="40px" width="auto"/></li>
                <li><a href="homepage.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="aboutus.html">About Us</a></li>
            </ul>
        </nav>
    
        <article class="contact-container">
            <section class="contact-info">
                <h2>Contact Information</h2>
                <p><strong>Address:</strong> 138 Berg Avenue, Pretoria, South Africa </p>
                <p><strong>Email:</strong> info@belgiumcampus.ac.za </p>
                <p><strong>Phone:</strong> +27 10 593 5368 </p>
            </section>
            <section class="contact-form">
                <h2>Contact Us</h2>
                <form>
                    <label for="firstname">First Name:</label>
                    <input type="text" id="firstname" name="firstname" required>
                    
                    <label for="lastname">Last Name:</label>
                    <input type="text" id="lastname" name="lastname" required>
                    
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                    
                    <button type="submit">Submit</button>
                </form>
            </section>
        </article>
       
    </body>
</html>
